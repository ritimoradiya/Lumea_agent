# Netlify picks Next.js up automatically via its official plugin; this file
# pins the versions so a local build and a deployed build agree.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # Netlify runs `npm install` with dev dependencies by default. Keep it that
  # way: the build needs TypeScript and Tailwind.
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The chat and Telegram endpoints stream and must never be cached.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# The admin area must never be cached or indexed.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
