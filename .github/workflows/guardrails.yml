name: Guardrails

# The live evaluation: real conversations through the real model, checked
# against the same guardrails `npm test` enforces offline.
#
# Prompt-level behaviour can regress from a wording change with nothing failing
# to compile, and only a live run catches that. It needs real keys and spends
# tokens, so it stays manual and weekly — Groq's free tier is ~170 turns a day
# and CI should not eat the budget a demo depends on. The offline half of the
# same guardrails runs on every push in ci.yml, for nothing.
on:
  workflow_dispatch:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"

jobs:
  behaviour:
    runs-on: ubuntu-latest
    # Skips cleanly on a fork or before secrets are configured, instead of
    # failing with a confusing auth error.
    if: github.event_name == 'workflow_dispatch' || github.repository_owner != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Paced for the 8,000 tokens-a-minute free tier. Going faster does not
      # fail loudly: the SDK retries silently and every reply looks slow.
      - name: Live evaluation
        run: npm run eval
        env:
          PACE_MS: "20000"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          GROQ_FALLBACK_MODEL: openai/gpt-oss-20b
          COMPANY_SLUG: lumea
          BRAIN: groq
