name: CI

# Runs on every push and pull request. Catches a broken build before it
# reaches Netlify rather than after.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Builds with placeholder secrets. The point is to catch compile and
      # prerender errors — nothing here talks to a real service, and putting
      # real keys in CI to build a static page would be a needless risk.
      - name: Build
        run: npm run build
        env:
          GROQ_API_KEY: placeholder-for-build
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          ADMIN_PASSWORD: placeholder
